# Publishes the npm package when a version tag (v1.2.3) is pushed, with npm trusted publishing:
# no token, and npm attaches the provenance of this workflow run. Set it up once on npmjs.com, in the
# settings of @math-labs/mathra: Trusted Publisher → GitHub Actions, repository matheusmota-dev-br/mathra, workflow npm.yml.
name: npm

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.129
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm/build.sh && npm/test/run.sh
      - name: the tag matches the version in Cargo.toml
        run: test "v$(node -p "require('./npm/pkg/package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm publish --access public
        working-directory: npm/pkg
