[package]
name = "mathra-python"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
# the module name imported in Python (`import mathra`) comes from pyproject.toml
name = "mathra_python"
crate-type = ["cdylib"]

[dependencies]
mathra.workspace = true
pyo3 = { version = "0.25", features = ["extension-module", "abi3-py39"] }
