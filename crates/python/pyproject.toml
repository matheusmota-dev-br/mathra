[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "mathra"
description = "Math LaTeX to accessible SVG, without a TeX install. Speech for screen readers in 16 languages."
readme = "README.md"
requires-python = ">=3.9"
dynamic = ["version"]
license = "(MIT OR Apache-2.0) AND OFL-1.1"
# copies of the repository root files: the OFL requires its text next to the embedded font
license-files = ["licenses/*"]
authors = [{ name = "Matheus Mota" }]
keywords = ["latex", "math", "equations", "svg", "accessibility", "screen-reader", "typesetting", "webassembly", "i18n", "localization", "katex-alternative", "mathjax-alternative", "rust", "python", "cli", "javascript", "typescript"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Text Processing :: Markup :: LaTeX",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://matheusmota-dev-br.github.io/mathra/"
Repository = "https://github.com/matheusmota-dev-br/mathra"
Issues = "https://github.com/matheusmota-dev-br/mathra/issues"
Documentation = "https://github.com/matheusmota-dev-br/mathra#install-and-use"
Funding = "https://github.com/sponsors/matheusmota-dev-br"

[tool.maturin]
python-source = "python"
module-name = "mathra._mathra"
features = ["pyo3/extension-module"]
