[package]
name = "mathra"
description = "Equation converter: math LaTeX to a tree of meaning and accessible SVG, with locale rules (English and pt-BR)."
version.workspace = true
edition.workspace = true
# the code is MIT OR Apache-2.0; the embedded STIX Two Math font is OFL-1.1
license = "(MIT OR Apache-2.0) AND OFL-1.1"
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["latex", "math", "svg", "accessibility", "equation"]
categories = ["text-processing", "rendering", "accessibility", "mathematics"]
include = ["src/**", "fonts/**", "Cargo.toml"]

[dependencies]
ttf-parser = "0.25"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# MathML input: a small XML parser with no dependencies of its own
roxmltree = "0.20"
