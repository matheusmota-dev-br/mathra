<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>mathra editor</title>
<script type="importmap">{ "imports": { "@mathlabs/mathra": "/npm/pkg/web/index.js" } }</script>
<style>
  html, body { height: 100%; margin: 0; }
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  mathra-editor { height: 100%; }
  .brand { display: inline-flex; align-items: baseline; gap: 6px; }
  .brand b { font-family: Georgia, "Times New Roman", serif; font-size: 18px; font-weight: 600; letter-spacing: 0.01em; }
  .brand span { font-size: 13px; opacity: 0.6; }
</style>
</head>
<body>
<mathra-editor id="editor" layout="page" locale="pt-BR" value="x = \frac{-b \pm \sqrt{b^2-4ac}}{2a}">
  <span slot="title" class="brand"><b>mathra</b><span>editor</span></span>
</mathra-editor>
<script type="module">
  import "/editor/dist/index.js";
  const editor = document.getElementById("editor");
  // the language and the theme chosen stay for the next visit
  const read = (k) => { try { return localStorage.getItem(k); } catch { return null; } };
  const write = (k, v) => { try { localStorage.setItem(k, v); } catch {} };
  if (read("mathra-locale")) editor.setAttribute("locale", read("mathra-locale"));
  if (read("mathra-theme")) editor.setAttribute("theme", read("mathra-theme"));
  editor.addEventListener("mathra-locale", (e) => { write("mathra-locale", e.detail.locale); document.documentElement.lang = e.detail.locale; });
  editor.addEventListener("mathra-theme", (e) => write("mathra-theme", e.detail.theme));
  // the time of each change, for the browser test
  window.mathraTimes = [];
  editor.addEventListener("input", () => window.mathraTimes.push(editor.field.lastTiming.total));
  editor.focus();
</script>
</body>
</html>
